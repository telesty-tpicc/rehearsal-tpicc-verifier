# DRAFT v2 stub verifier (REHEARSAL ONLY, never run). Differs from promote.yml (v1) in ONE respect, to fix M1a finding 5 / test L17:
# the fast-forward check now happens BEFORE the status is posted, so a green rehearsal/verified status can never exist on a commit that
# is not promoted (v1 posted the status first and left a green status on a diverging branch).
name: promote
on:
  schedule: [{cron: '*/10 * * * *'}]
  workflow_dispatch:
permissions: {}
concurrency: promote
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1
        with: {persist-credentials: false}
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        with:
          client-id: ${{ vars.VERIFIER_CLIENT_ID }}
          private-key: ${{ secrets.VERIFIER_APP_KEY }}
          owner: ${{ vars.TARGET_ORG }}
          repositories: ${{ vars.TARGET_REPO }}
          permission-contents: write
          permission-statuses: write
          permission-metadata: read
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          T: ${{ vars.TARGET_ORG }}/${{ vars.TARGET_REPO }}
        run: |
          set -euo pipefail
          case "${T#*/}" in rehearsal-*) ;; *) echo "refusing: target is not a rehearsal repository"; exit 1;; esac
          tips=$(gh api "repos/$T/git/matching-refs/heads/agent/" --jq '.[].object.sha' || true)
          { grep -E '^[0-9a-f]{40}$' approved-shas.txt || true; } | while read -r sha; do
            printf '%s\n' "$tips" | grep -qx "$sha" || { echo "skip $sha: not the tip of an agent/* branch"; continue; }
            main=$(gh api "repos/$T/git/ref/heads/main" --jq .object.sha)
            if [ "$sha" != "$main" ]; then
              st=$(gh api "repos/$T/compare/$main...$sha" --jq .status)
              [ "$st" = "ahead" ] || { echo "not a fast-forward ($st): $sha  (no status posted)"; continue; }
            fi
            gh api -X POST "repos/$T/statuses/$sha" -f state=success -f context=rehearsal/verified -f description="stub verifier: Owner-listed SHA" >/dev/null
            [ "$sha" = "$main" ] && { echo "already main: $sha"; continue; }
            gh api -X PATCH "repos/$T/git/refs/heads/main" -f sha="$sha" -F force=false >/dev/null && echo "promoted $sha"
          done
